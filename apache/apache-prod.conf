# D8 - pas de version ni d'OS dans l'en-tete Server et les pages d'erreur
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Front-end (SPA fallback to index.html)
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # D7 - en-tetes de securite sur toutes les reponses (front et API)
    # (les "Header unset" retirent la copie envoyee par Flask pour ne pas avoir les en-tetes en double)
    Header unset Content-Security-Policy
    Header unset X-Content-Type-Options
    Header unset X-Frame-Options
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    # D8 - ne pas relayer le nom du serveur applicatif (gunicorn / Werkzeug) au client
    Header unset Server

    # Back-end
    ProxyPass /api/ http://127.0.0.1:9001/
    ProxyPassReverse /api/ http://127.0.0.1:9001/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
