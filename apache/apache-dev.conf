ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

<IfModule unixd_module>
    User www-data
    Group www-data
</IfModule>

ServerName localhost

# D8 - pas de version ni d'OS dans l'en-tete Server et les pages d'erreur
ServerTokens Prod
ServerSignature Off

ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 common
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<IfModule headers_module>
    RequestHeader unset Proxy early
</IfModule>

ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# D7 - en-tetes de securite (la CSP stricte est appliquee en prod : le serveur Vite de dev utilise des scripts inline)
# (les "Header unset" retirent la copie envoyee par Flask pour ne pas avoir les en-tetes en double)
Header unset X-Content-Type-Options
Header unset X-Frame-Options
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"

# D8 - ne pas relayer le nom des serveurs applicatifs (Werkzeug / Vite) au client
Header unset Server

# Back-end
ProxyPass /api/ http://back:9001/
ProxyPassReverse /api/ http://back:9001/

# Front-end
ProxyPass / http://front:9000/
ProxyPassReverse / http://front:9000/
